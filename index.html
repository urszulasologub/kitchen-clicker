<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Kitchen Clicker</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/scene.css" />
  <link rel="stylesheet" href="styles/cook.css" />
  <link rel="stylesheet" href="styles/cookbook.css" />
  <link rel="stylesheet" href="styles/purchases.css" />
  <link rel="stylesheet" href="styles/effects.css" />
  <link rel="stylesheet" href="styles/fancy.css" />
  <link rel="stylesheet" href="styles/panels.css" />
  <link rel="stylesheet" href="styles/toast.css" />
  <link rel="stylesheet" href="styles/mobile.css" />
</head>
<body>
  <div id="scene">
    <!-- Default to the cracked wall — switches to wall.png after the
         player buys the Renovation upgrade. -->
    <img id="bg-wall" src="Sprites/Custom-sprites/Background/poor-wall.png" alt="" />
    <!-- The kitchen counter top — hidden until the player buys the Counter
         upgrade. Pot stays clickable either way; it just sits lower without
         the counter under it. -->
    <img id="bg-counter" class="hidden" src="Sprites/Custom-sprites/Background/counter.png" alt="" />

    <!-- Day/night cycle: tinted overlay sweeping across real-world hours -->
    <div id="day-night-overlay"></div>

    <!-- Each purchased item shows up here on shelf or counter -->
    <div id="purchases"></div>

    <!-- Chalkboard top-left: stats + reset -->
    <div id="chalkboard">
      <div class="chalk-row"><span id="coins-label">$0</span></div>
      <div class="chalk-row small"><span id="cps-label">0 / sec</span></div>
      <div class="chalk-row small"><span id="click-label">+1 / click</span></div>
      <button id="reset-btn" type="button">RESET</button>
    </div>

    <!-- Counter scene with pot, splash, dish, glow -->
    <div id="cook-area">
      <img class="glow" id="glow" src="Sprites/Sprites/Animations/Glow/Glow_Center.png" alt="" />
      <img class="splash" id="splash" src="" alt="" />
      <div id="dish-layer"></div>
      <div class="pot-wrap" id="pot">
        <img class="pot-base" src="Sprites/Sprites/Environment/Pot/pot_base.png" alt="" />
        <img class="pot-lid" id="pot-lid" src="Sprites/Sprites/Environment/Pot/pot_lid.png" alt="" />
      </div>
      <div id="ghost-layer"></div>
      <div id="float-layer"></div>
    </div>

    <!-- Particle layer (leaves at high tiers) -->
    <div id="particle-layer"></div>

    <!-- FRENZY tier-promotion banner -->
    <div id="frenzy"></div>

    <!-- Now-cooking progress widget (shown while a dish is in progress) -->
    <div id="cook-progress" class="hidden">
      <img class="progress-icon" id="progress-icon" alt="" />
      <div class="progress-info">
        <div class="progress-name" id="progress-name"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-clicks" id="progress-clicks"></div>
        <div class="progress-value" id="progress-value"></div>
      </div>
    </div>

    <!-- Screen flash on dish completion -->
    <div id="screen-flash" class="screen-flash"></div>

    <!-- Fridge: back-left of the kitchen, behind the counter. Hidden until
         the player buys the Fridge upgrade. -->
    <img class="fridge hidden" src="Sprites/Custom-sprites/Objects/fridge.png" alt="" />
    <!-- Items piled on the fridge shelves. Same box, % positioning. -->
    <div id="fridge-items" class="hidden"></div>

    <!-- Wall shelves: hidden until the upgrade is bought -->
    <img id="shelves-decor" class="shelves-decor hidden"
         src="Sprites/Custom-sprites/Objects/shelves.png" alt="" />
    <!-- Items piled on the shelves (oats jars, flour bags). Same box, % positioning. -->
    <div id="shelves-items" class="hidden"></div>

    <!-- Furniture cabinet with countertop: hidden until bought -->
    <div id="furniture-decor" class="furniture-decor hidden">
      <img class="furniture-base"
           src="Sprites/Custom-sprites/Objects/furniture-with-counter.png" alt="" />
      <!-- Cheese stand sits on the furniture; cheese pieces pile on top of it -->
      <div id="cheese-stand-decor" class="cheese-stand-decor hidden">
        <img class="cheese-stand-img"
             src="Sprites/Sprites/Environment/Shelf/cheese_stand.png" alt="" />
      </div>
    </div>

    <!-- Oven cabinet: hidden until the upgrade is bought -->
    <img id="oven-decor" class="oven-decor hidden"
         src="Sprites/Custom-sprites/Objects/oven.png" alt="" />

    <!-- Counter zone: holds everything sitting on the counter. Children
         use %-based positioning so they scale with --counter-height. -->
    <div id="counter-items">
      <img class="counter-decor stove hidden" id="stove-decor" src="Sprites/Sprites/Environment/Counter/stove.png" alt="" />
      <img class="counter-decor coffee hidden" id="coffee-decor" src="Sprites/Sprites/Environment/Counter/coffemaker.png" alt="" />
      <img class="counter-decor cactus" src="Sprites/Sprites/Environment/Counter/cactus_plant.png" alt="" />

      <!-- Bread basket: hidden until Bread Basket upgrade is bought -->
      <div class="basket-decor hidden" id="basket-decor">
        <img class="basket-base"  src="Sprites/Sprites/Animations/Basket/basket_base.png" alt="" />
        <img class="basket-cover" id="basket-cover" src="Sprites/Sprites/Animations/Basket/basket_1.png" alt="" />
      </div>
    </div>

    <!-- Recently cooked menu -->
    <div id="recent-menu">
      <div class="recent-title">RECENT</div>
      <div id="recent-list"></div>
    </div>

    <!-- Cookbook on the right: upgrade cards -->
    <div id="book">
      <img class="book-bg" src="Sprites/Sprites/Book/Book_Back.png" alt="" />
      <img class="book-bg book-mid"   src="Sprites/Sprites/Book/Book_Mid.png" alt="" />
      <img class="book-bg book-pages" src="Sprites/Sprites/Book/Book_Pages.png" alt="" />
      <div class="book-content">
        <div class="book-title">COOKBOOK</div>
        <div id="upgrades"></div>
      </div>
    </div>

    <!-- Bottom-left UI buttons: open panels -->
    <div id="ui-buttons">
      <button id="btn-recipes"      type="button" title="Recipe Book (R)">RECIPES</button>
      <button id="btn-achievements" type="button" title="Achievements (A)">AWARDS</button>
      <button id="btn-stats"        type="button" title="Stats (T)">STATS</button>
      <!-- Mobile-only — the top-banner #recent-menu is hidden on small
           screens, so this button surfaces the same info in a panel. -->
      <button id="btn-recent"       type="button" title="Recent dishes" class="mobile-only">RECENT</button>
      <button id="btn-mute"         type="button" title="Toggle music">MUSIC: ON</button>
    </div>

    <!-- Toast notifications stack -->
    <div id="toast-stack"></div>

    <!-- Modal panels -->
    <div id="panel-backdrop"></div>

    <div id="panel-recipes" class="panel">
      <div class="panel-header">
        <span class="panel-title">Recipe Book</span>
        <button class="panel-close" type="button">✕</button>
      </div>
      <div id="recipes-list" class="panel-content"></div>
    </div>

    <div id="panel-achievements" class="panel">
      <div class="panel-header">
        <span class="panel-title">Achievements</span>
        <button class="panel-close" type="button">✕</button>
      </div>
      <div id="achievements-list" class="panel-content"></div>
    </div>

    <div id="panel-stats" class="panel">
      <div class="panel-header">
        <span class="panel-title">Stats</span>
        <button class="panel-close" type="button">✕</button>
      </div>
      <div id="stats-list" class="panel-content"></div>
    </div>

    <div id="panel-recent" class="panel">
      <div class="panel-header">
        <span class="panel-title">Recent Dishes</span>
        <button class="panel-close" type="button">✕</button>
      </div>
      <div id="recent-panel-list" class="panel-content"></div>
    </div>
  </div>

  <!-- Hamburger toggle — slides the cookbook in/out. Lives OUTSIDE #scene so it
       isn't clipped by overflow:hidden and isn't transformed by fancy-5. -->
  <button id="btn-cookbook-toggle" class="btn-cookbook-toggle"
          type="button" aria-label="Toggle cookbook" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <script type="module" src="src/main.js"></script>
</body>
</html>
